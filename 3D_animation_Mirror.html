 <html>
<head>
  <title>3D </title>
  <style>
    .card {
      width: 250px;
      height: 150px;
      background: linear-gradient(135deg, rgb(104, 167, 156), rgba(12, 12, 12, 0.753));
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      transition: transform 1s;
      transform-style: preserve-3d;
    }

    .card:hover {
      transform: rotateY(180deg) rotateX(15deg);
    }
  </style>
</head>
<body>
  <div class="card">3D Hover!</div>
</body>
</html>
